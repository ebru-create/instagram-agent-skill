name: Regression tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r skills/ig-carousel/requirements.txt
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: python -m unittest discover -s tests -v
      - run: python evaluation/evaluate.py evaluation/fixtures.json --out evaluation-report.json
      - run: python skills/ig-account/publication.py check skills/ig-account/example.publication.tr.json --account ornek_studyo
      - run: python skills/ig-account/turkce.py analiz skills/ig-audit/example.synthetic.csv --hesap ornek_studyo --olcut paylasim_orani
      - run: python skills/ig-account/turkce.py ice-aktar skills/ig-audit/import.example.tr.csv --esleme skills/ig-audit/import.mapping.example.tr.json --hesap ornek_studyo --cikti csv-import-example
      - run: python skills/ig-audit/analyse.py skills/ig-audit/example.synthetic.csv --account ornek_studyo --primary-metric shares_per_reach > analytics-example.json
      - run: python skills/ig-plan/experiment.py skills/ig-plan/example.experiment.tr.json --account ornek_studyo --csv skills/ig-audit/example.synthetic.csv --as-of 2026-09-13T12:00:00+03:00 > experiment-example.json
      - run: python skills/ig-carousel/render.py skills/ig-carousel/example.tr.json --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --out carousel-example
      - run: python validation/run_workflow.py --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --out workflow-example
      - uses: actions/upload-artifact@v4
        with:
          name: hook-evaluation-python-${{ matrix.python-version }}
          path: evaluation-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: carousel-example-python-${{ matrix.python-version }}
          path: carousel-example
      - uses: actions/upload-artifact@v4
        with:
          name: analytics-synthetic-python-${{ matrix.python-version }}
          path: analytics-example.json
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-synthetic-python-${{ matrix.python-version }}
          path: experiment-example.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-synthetic-python-${{ matrix.python-version }}
          path: workflow-example
      - uses: actions/upload-artifact@v4
        with:
          name: csv-import-synthetic-python-${{ matrix.python-version }}
          path: csv-import-example
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_release.py --out release-candidate
      - run: python scripts/package_release.py --verify release-candidate/instagram-agent-skill-1.15.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-1.15.0
          path: release-candidate
